# Node.js
# Build a general Node.js project with pnpm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

pool:
    vmImage: "macOS-26"

parameters:
    - name: buildAndroid
      displayName: Build Android
      type: boolean
      default: false
    - name: buildIOS
      displayName: Build iOS
      type: boolean
      default: false
    - name: uploadIOS
      displayName: Upload iOS to App Store Connect
      type: boolean
      default: false

variables:
    appleTeamId: "2Y26AXFP33"
    iosBundleId: "deanvniekerk.k53studyguide.app"
    iosProvisioningProfileName: "K53StudyGuide_AppStore"

steps:
    - task: UseNode@1
      inputs:
          version: "22.x"
      displayName: "Install Node.js"
    - script: |
          corepack enable
          pnpm install --frozen-lockfile
      displayName: "React App > Install"
    - script: |
          pnpm lint
      displayName: "React App > Lint"
    - script: |
          pnpm test
      displayName: "React App > Test"
    - script: |
          pnpm build
      displayName: "React App > Build"
      env:
          REVENUECAT_ANDROID_API_KEY: $(REVENUECAT_ANDROID_API_KEY)
          REVENUECAT_IOS_API_KEY: $(REVENUECAT_IOS_API_KEY)

    - script: |
          pnpm cap-sync-android
      displayName: "React App > Sync to Android Project"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - script: |
          pnpm cap-copy-android
      displayName: "React App > Copy to Android Project"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))

    - task: Gradle@4
      inputs:
          workingDirectory: "pkg/app/android"
          gradleWrapperFile: "pkg/app/android/gradlew"
          gradleOptions: "-Xmx3072m"
          tasks: "build"
          javaHomeOption: "Path"
          jdkDirectory: "$(JAVA_HOME_21_X64)"
      displayName: "Android > Build"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - task: DownloadSecureFile@1
      name: androidKeystore
      inputs:
          secureFile: "upload-keystore.jks"
      displayName: "Android APK > Download Keystore"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - script: |
          set -euo pipefail

          sdkRoot="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "${sdkRoot}" ] || [ ! -d "${sdkRoot}/build-tools" ]; then
            echo "##vso[task.logissue type=error]Android SDK build-tools directory was not found."
            exit 1
          fi

          buildToolsVersion="$(ls -1 "${sdkRoot}/build-tools" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          buildToolsDir="${sdkRoot}/build-tools/${buildToolsVersion}"
          zipalign="${buildToolsDir}/zipalign"
          apksigner="${buildToolsDir}/apksigner"

          unsignedApk="pkg/app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          outputDir="$(Build.ArtifactStagingDirectory)/android"
          alignedApk="${outputDir}/app-release-aligned.apk"
          signedApk="${outputDir}/app-release.apk"

          test -x "${zipalign}"
          test -x "${apksigner}"
          test -f "${unsignedApk}"
          test -f "${ANDROID_KEYSTORE_PATH}"

          rm -rf "${outputDir}"
          mkdir -p "${outputDir}"

          # Android 15+ can run on 16 KB page-size devices. Use -P 16 so
          # uncompressed native libraries are page-aligned before signing.
          "${zipalign}" -P 16 -f -v 4 "${unsignedApk}" "${alignedApk}"
          "${apksigner}" sign \
            --ks "${ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "upload" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "${signedApk}" \
            "${alignedApk}"

          "${apksigner}" verify --verbose --print-certs "${signedApk}"
          "${zipalign}" -c -P 16 -v 4 "${signedApk}"
      displayName: "Android APK > Align and Sign"
      env:
          ANDROID_KEYSTORE_PATH: $(androidKeystore.secureFilePath)
          ANDROID_KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
          ANDROID_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - task: CopyFiles@2
      inputs:
          SourceFolder: "$(Build.ArtifactStagingDirectory)/android"
          Contents: "app-release.apk"
          flattenFolders: true
          TargetFolder: "$(Build.ArtifactStagingDirectory)"
      displayName: "Android APK > Copy to Artifacts"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))

    - script: |
          pnpm cap-sync-ios
      displayName: "React App > Sync to iOS Project"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - script: |
          pnpm cap-copy-ios
      displayName: "React App > Copy to iOS Project"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - task: InstallAppleCertificate@2
      inputs:
          certSecureFile: "K53StudyGuide_AppleDistribution.p12"
          certPwd: "$(APPLE_CERTIFICATE_PASSWORD)"
          keychain: "temp"
          opensslPkcsArgs: "-legacy"
      displayName: "iOS > Install Apple Certificate"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: InstallAppleProvisioningProfile@1
      inputs:
          provisioningProfileLocation: "secureFiles"
          provProfileSecureFile: "K53StudyGuide_AppStore.mobileprovision"
      displayName: "iOS > Install Apple Provisioning Profile"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - script: |
          set -euo pipefail

          xcodebuild -version
          sdkVersion="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: ${sdkVersion}"

          case "${sdkVersion}" in
            26.*|[3-9][0-9].*) ;;
            *)
              echo "##vso[task.logissue type=error]App Store uploads require the iOS 26 SDK or later."
              exit 1
              ;;
          esac
      displayName: "iOS > Verify Xcode SDK"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    # Keep the iOS build as explicit xcodebuild steps instead of Xcode@5. In the
    # Azure logs, the wrapper archived without the generic iOS destination and
    # hid the failing Firebase pod boundary behind the final archive failure.
    - script: |
          set -euo pipefail

          podFile="pkg/app/ios/App/Podfile"
          podLock="pkg/app/ios/App/Podfile.lock"
          if ! grep -q "CapacitorFirebaseAnalytics/Analytics" "${podLock}" || ! grep -q "FirebaseAnalytics/Core" "${podLock}"; then
            echo "##vso[task.logissue type=error]Firebase Analytics pods were not resolved after Capacitor sync."
            echo "Podfile Firebase lines:"
            grep -n "CapacitorFirebaseAnalytics\\|FirebaseAnalytics" "${podFile}" || true
            echo "Podfile.lock Firebase lines:"
            grep -n "CapacitorFirebaseAnalytics\\|FirebaseAnalytics" "${podLock}" || true
            exit 1
          fi

          xcodebuild \
            -project "pkg/app/ios/App/Pods/Pods.xcodeproj" \
            -target "CapacitorFirebaseAnalytics" \
            -configuration "Release" \
            -sdk "iphoneos" \
            clean build \
            CODE_SIGNING_ALLOWED=NO
      displayName: "iOS > Verify Firebase Analytics Pod"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - script: |
          set -euo pipefail

          : "${APPLE_CERTIFICATE_SIGNING_IDENTITY:?Apple signing identity was not installed}"
          : "${APPLE_PROV_PROFILE_UUID:?Apple provisioning profile UUID was not installed}"

          profile="${HOME}/Library/MobileDevice/Provisioning Profiles/${APPLE_PROV_PROFILE_UUID}.mobileprovision"
          test -f "${profile}"

          security cms -D -i "${profile}" > "$(Agent.TempDirectory)/k53-profile.plist"
          profileName="$(/usr/libexec/PlistBuddy -c "Print :Name" "$(Agent.TempDirectory)/k53-profile.plist")"
          teamId="$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$(Agent.TempDirectory)/k53-profile.plist")"
          appIdentifier="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$(Agent.TempDirectory)/k53-profile.plist")"

          echo "Signing identity: ${APPLE_CERTIFICATE_SIGNING_IDENTITY}"
          echo "Provisioning profile: ${profileName}"
          echo "Provisioning team: ${teamId}"
          echo "Provisioning app id: ${appIdentifier}"

          if [ "${teamId}" != "$(appleTeamId)" ]; then
            echo "##vso[task.logissue type=error]Provisioning profile team '${teamId}' does not match expected team '$(appleTeamId)'."
            exit 1
          fi

          if [ "${profileName}" != "$(iosProvisioningProfileName)" ]; then
            echo "##vso[task.logissue type=error]Provisioning profile '${profileName}' does not match expected profile '$(iosProvisioningProfileName)'."
            exit 1
          fi

          case "${appIdentifier}" in
            *."$(iosBundleId)") ;;
            *)
              echo "##vso[task.logissue type=error]Provisioning profile app id '${appIdentifier}' does not match bundle id '$(iosBundleId)'."
              exit 1
              ;;
          esac
      displayName: "iOS > Verify Signing Assets"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - script: |
          set -euo pipefail

          outputDir="$(Build.ArtifactStagingDirectory)/ios"
          archivePath="${outputDir}/App.xcarchive"
          rm -rf "${outputDir}"
          mkdir -p "${outputDir}"

          # Do not pass signing settings here: xcodebuild applies command-line
          # build settings to Pods too, and Pods cannot use provisioning profiles.
          xcodebuild \
            -workspace "pkg/app/ios/App/App.xcworkspace" \
            -scheme "App" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -destination "generic/platform=iOS" \
            -archivePath "${archivePath}" \
            -derivedDataPath "$(Agent.TempDirectory)/k53-ios-derived-data" \
            clean archive
      displayName: "iOS > Archive"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - script: |
          set -euo pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$(Build.ArtifactStagingDirectory)/ios/App.xcarchive" \
            -exportPath "$(Build.ArtifactStagingDirectory)/ios" \
            -exportOptionsPlist "pkg/app/ios/App/ExportOptions.plist"
      displayName: "iOS > Export IPA"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: CopyFiles@2
      inputs:
          SourceFolder: "$(Build.ArtifactStagingDirectory)/ios"
          Contents: "*.ipa"
          flattenFolders: true
          TargetFolder: "$(Build.ArtifactStagingDirectory)"
      displayName: "iOS IPA > Copy to Artifacts"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: AppStoreRelease@1
      inputs:
          authType: "ApiKey"
          apiKeyId: "$(APP_STORE_CONNECT_API_KEY_ID)"
          apiKeyIssuerId: "$(APP_STORE_CONNECT_API_ISSUER_ID)"
          apitoken: "$(APP_STORE_CONNECT_API_KEY_BASE64)"
          appIdentifier: "$(iosBundleId)"
          appType: "iOS"
          releaseTrack: "TestFlight"
          ipaPath: "$(Build.ArtifactStagingDirectory)/*.ipa"
          shouldSkipWaitingForProcessing: true
          shouldSkipSubmission: true
          teamId: "$(appleTeamId)"
      displayName: "iOS IPA > Upload to App Store Connect"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'), eq('${{ parameters.uploadIOS }}', 'true'))

    - task: PublishPipelineArtifact@1
      inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)"
          artifact: "drop"
      displayName: "Publish Artifacts"

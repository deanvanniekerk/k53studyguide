# Node.js
# Build a general Node.js project with pnpm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

pool:
    vmImage: "macOS-26"

parameters:
    - name: buildAndroid
      displayName: Build Android
      type: boolean
      default: false
    - name: buildIOS
      displayName: Build iOS
      type: boolean
      default: false
    - name: uploadIOS
      displayName: Upload iOS to App Store Connect
      type: boolean
      default: false

variables:
    appleTeamId: "2Y26AXFP33"
    iosBundleId: "deanvniekerk.k53studyguide.app"

steps:
    - task: UseNode@1
      inputs:
          version: "22.x"
      displayName: "Install Node.js"
    - script: |
          corepack enable
          pnpm install --frozen-lockfile
      displayName: "React App > Install"
    - script: |
          pnpm lint
      displayName: "React App > Lint"
    - script: |
          pnpm test
      displayName: "React App > Test"
    - script: |
          pnpm build
      displayName: "React App > Build"

    - script: |
          pnpm cap-sync-android
      displayName: "React App > Sync to Android Project"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - script: |
          pnpm cap-copy-android
      displayName: "React App > Copy to Android Project"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))

    - task: Gradle@4
      inputs:
          workingDirectory: "pkg/app/android"
          gradleWrapperFile: "pkg/app/android/gradlew"
          gradleOptions: "-Xmx3072m"
          tasks: "build"
          javaHomeOption: "Path"
          jdkDirectory: "$(JAVA_HOME_21_X64)"
      displayName: "Android > Build"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - task: AndroidSigning@3
      inputs:
          apkFiles: "**/app-release-unsigned.apk"
          apksignerKeystoreFile: "upload-keystore.jks"
          apksignerKeystorePassword: "$(ANDROID_KEYSTORE_PASSWORD)"
          apksignerKeystoreAlias: "upload"
          apksignerKeyPassword: "$(ANDROID_KEY_PASSWORD)"
          zipalign: true
      displayName: "Android APK > Sign"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))
    - task: CopyFiles@2
      inputs:
          Contents: "**/app-release-unsigned.apk"
          flattenFolders: true
          TargetFolder: "$(Build.ArtifactStagingDirectory)"
      displayName: "Android APK > Copy to Artifacts"
      condition: and(succeeded(), eq('${{ parameters.buildAndroid }}', 'true'))

    - script: |
          pnpm cap-sync-ios
      displayName: "React App > Sync to iOS Project"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - script: |
          pnpm cap-copy-ios
      displayName: "React App > Copy to iOS Project"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - task: InstallAppleCertificate@2
      inputs:
          certSecureFile: "K53StudyGuide_AppleDistribution.p12"
          certPwd: "$(APPLE_CERTIFICATE_PASSWORD)"
          keychain: "temp"
          opensslPkcsArgs: "-legacy"
      displayName: "iOS > Install Apple Certificate"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: InstallAppleProvisioningProfile@1
      inputs:
          provisioningProfileLocation: "secureFiles"
          provProfileSecureFile: "K53StudyGuide_AppStore.mobileprovision"
      displayName: "iOS > Install Apple Provisioning Profile"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - script: |
          set -euo pipefail

          xcodebuild -version
          sdkVersion="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: ${sdkVersion}"

          case "${sdkVersion}" in
            26.*|[3-9][0-9].*) ;;
            *)
              echo "##vso[task.logissue type=error]App Store uploads require the iOS 26 SDK or later."
              exit 1
              ;;
          esac
      displayName: "iOS > Verify Xcode SDK"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))

    - task: Xcode@5
      inputs:
          actions: "clean archive"
          sdk: "iphoneos"
          scheme: "App"
          configuration: "Release"
          xcodeVersion: "default"
          xcWorkspacePath: "pkg/app/ios/App/App.xcworkspace"
          signingOption: "default"
          packageApp: true
          archivePath: "$(Build.ArtifactStagingDirectory)/ios/App.xcarchive"
          exportPath: "$(Build.ArtifactStagingDirectory)/ios"
          exportOptions: "plist"
          exportOptionsPlist: "pkg/app/ios/App/ExportOptions.plist"
          useXcpretty: "false"
      displayName: "iOS > Build IPA"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: CopyFiles@2
      inputs:
          SourceFolder: "$(Build.ArtifactStagingDirectory)/ios"
          Contents: "*.ipa"
          flattenFolders: true
          TargetFolder: "$(Build.ArtifactStagingDirectory)"
      displayName: "iOS IPA > Copy to Artifacts"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'))
    - task: AppStoreRelease@1
      inputs:
          authType: "ApiKey"
          apiKeyId: "$(APP_STORE_CONNECT_API_KEY_ID)"
          apiKeyIssuerId: "$(APP_STORE_CONNECT_API_ISSUER_ID)"
          apitoken: "$(APP_STORE_CONNECT_API_KEY_BASE64)"
          appIdentifier: "$(iosBundleId)"
          appType: "iOS"
          releaseTrack: "TestFlight"
          ipaPath: "$(Build.ArtifactStagingDirectory)/*.ipa"
          shouldSkipWaitingForProcessing: true
          shouldSkipSubmission: true
          teamId: "$(appleTeamId)"
      displayName: "iOS IPA > Upload to App Store Connect"
      condition: and(succeeded(), eq('${{ parameters.buildIOS }}', 'true'), eq('${{ parameters.uploadIOS }}', 'true'))

    - task: PublishPipelineArtifact@1
      inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)"
          artifact: "drop"
      displayName: "Publish Artifacts"

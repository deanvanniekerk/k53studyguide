<!doctype html><html><head><meta charset="utf-8"><title>K53 screenshot contact sheet</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui;background:#eef0f7;color:#172044}h1{font-size:26px;margin:0 0 20px}.row{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}.row img{width:100%;height:480px;object-fit:contain;object-position:top}.row p{font-size:12px}</style></head><body><h1></h1><div class="row"></div><script>const p=new URLSearchParams(location.search),family=p.get('family')||'apple/iphone',count=Number(p.get('count')||7);document.querySelector('h1').textContent='K53 Study Guide — '+family;document.querySelector('.row').style.gridTemplateColumns='repeat('+count+',1fr)';const scenes=['study','quiz','test','content','results','languages','dark'];for(let i=0;i<count;i++){let d=document.createElement('div');d.innerHTML='<img src="../final/'+family+'/'+String(i+1).padStart(2,'0')+'-'+scenes[i]+'.jpg"><p>'+String(i+1).padStart(2,'0')+' · '+scenes[i]+'</p>';document.querySelector('.row').append(d)}Promise.all([...document.images].map(x=>x.decode())).then(()=>document.body.dataset.ready='true');</script></body></html>

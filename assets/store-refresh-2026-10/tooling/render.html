<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>K53 store creative renderer</title>
<style>
@font-face{font-family:Jakarta;src:url('./PlusJakartaSans.ttf') format('truetype');font-weight:200 800;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091d43}
body{font-family:Jakarta,sans-serif;color:white}
.background{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}
header{position:absolute;left:5%;right:5%;top:2.7%;height:7.3%;display:flex;align-items:center;justify-content:center;z-index:2}
h1{font-size:5.8vw;letter-spacing:-.025em;line-height:1.15;margin:0;font-weight:700;text-align:center;text-wrap:balance}
.screen{position:absolute;left:50%;transform:translateX(-50%);border-radius:1.6vw;box-shadow:0 .6vw 2vw #020b2426}
.landscape header{display:none}
</style>
</head>
<body>
<img class="background" alt="" src="../concepts/quiet-background.png">
<header><h1></h1></header>
<script>
const params=new URLSearchParams(location.search);
const family=params.get('family')||'iphone';
const scene=params.get('scene')||'study';
const stories={
 study:'Track your study progress',
 quiz:'Practise with fresh quizzes',
 test:'Build confidence with Premium mock tests',
 content:'Learn road signs and rules',
 results:'Review your Premium test results',
 languages:'Choose from four languages',
 dark:'Study in light or dark mode'
};
if(params.has('landscape')){
 document.body.className='landscape';
 document.querySelector('.background').src='../concepts/'+({apple:'apple-header-master.png',search:'apple-search-master.png',play:'play-feature-master.png'}[params.get('landscape')]);
}else{
 document.querySelector('h1').textContent=stories[scene];
 const img=document.createElement('img');
 img.className='screen';
 img.alt=scene+' — authentic '+family+' app capture';
 img.src='../source-captures/'+family+'/'+scene+'.jpg';
 document.body.append(img);
}
Promise.all([...document.images].map(img=>img.decode())).then(()=>document.fonts.ready).then(()=>{
 const img=document.querySelector('.screen');
 if(img){
  // Fit the entire capture uniformly in the available space, including tablet layouts.
  const scale=Math.min(innerWidth*.94/img.naturalWidth,innerHeight*.86/img.naturalHeight);
  const width=img.naturalWidth*scale,height=img.naturalHeight*scale;
  Object.assign(img.style,{width:width+'px',height:height+'px',top:(innerHeight*.12+(innerHeight*.86-height)/2)+'px'});
 }
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.dataset.ready='true'));
});
</script>
</body>
</html>
